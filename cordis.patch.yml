# ============================================================================
# dsh-model-tabs —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时按 bundle 层栈叠加各插件的 patch，本文件把
# dsh-model-tabs 插入 profile 的配置树。
#
# 本插件是**纯客户端插件**：
#   · Host 半边  lib/index.js —— 空插件（只为满足 bundle patch 需要可解析的 main）
#   · Client 半边 lib/client.js —— 接管 conversation.input.model 槽 + 注册 settings.section 设置页
#
# 注意：id 必须与包名一致（设置页与客户端模块都按它寻址），
#      且该行不要在行尾写注释（商城预检正则按整行匹配）。
# ============================================================================

- insert:
    - id: dsh-model-tabs
      name: 'dsh-model-tabs'
